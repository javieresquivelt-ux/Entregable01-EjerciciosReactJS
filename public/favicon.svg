<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fondo con esquinas redondeadas (r=10 → ~15% del lado) -->
  <rect width="64" height="64" rx="10" ry="10" fill="#4f46e5"/>

  <!-- Letras RJS centradas verticalmente en baseline -->
  <!-- font-family monoespaciado incluido inline para máxima compatibilidad en browser tabs -->
  <text
    x="32"
    y="43"
    text-anchor="middle"
    font-family="'JetBrains Mono', 'Courier New', monospace"
    font-weight="700"
    font-size="25"
    fill="#ffffff"
    letter-spacing="-0.5"
  >RJS</text>
</svg>